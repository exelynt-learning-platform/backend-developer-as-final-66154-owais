spring.application.name=booking-system

# PostgreSQL configuration (override with environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT (set APP_JWT_SECRET env var; must be at least 256 bits / 32 chars)
app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-very-long-random-secret-for-local-dev-only}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Seed data (dev/test only; never enable in prod)
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:admin123}
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@example.com}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
